<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器里编写 Dockerfile、构建镜像与练习 Docker 命令。">
  <title>Docker Playground</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
<header class="masthead">
  <div class="brand"><span class="mark" aria-hidden="true">▦</span><strong>Docker Playground</strong></div>
  <div class="header-actions"><span class="environment">模拟环境</span><button id="reset" type="button" class="quiet">重置工作区</button></div>
</header>
<main>
  <div class="workspace">
    <section class="panel" aria-labelledby="containers-title">
      <div class="panel-header"><h1 id="containers-title">容器</h1><span id="counts" class="muted"></span></div>
      <div class="table-wrap">
        <table><thead><tr><th>名称</th><th>镜像</th><th>状态</th><th>端口</th></tr></thead><tbody id="containers"></tbody></table>
      </div>
    </section>
    <section class="panel editor" aria-label="文件编辑器">
      <aside class="files">
        <div class="panel-header"><h2>文件</h2><button id="create" class="icon" type="button" aria-label="新建文件或目录" title="新建文件或目录">+</button></div>
        <div id="file-tree" class="file-tree"></div>
        <div class="file-actions"><button id="rename" class="quiet" type="button">重命名</button><button id="remove" class="quiet" type="button">删除</button></div>
      </aside>
      <div class="editing">
        <div class="panel-header"><h2 id="filename">Dockerfile</h2><button id="save" class="primary compact" type="button">保存</button></div>
        <div class="source"><pre id="line-numbers" aria-hidden="true">1</pre><textarea id="text" aria-label="文件内容" spellcheck="false" wrap="off"></textarea></div>
      </div>
    </section>
    <section class="panel terminal" aria-labelledby="terminal-title">
      <div class="panel-header"><h2 id="terminal-title">终端</h2><button id="clear" class="quiet" type="button">清空</button></div>
      <div id="output" class="output" role="log" tabindex="0" aria-label="终端输出"></div>
      <form id="command-form" autocomplete="off">
        <span id="prompt" aria-hidden="true"></span><input id="command" aria-label="终端命令" spellcheck="false" placeholder="输入 Docker 命令，按 Enter 执行">
        <button type="submit" class="quiet">执行</button>
      </form>
    </section>
  </div>
  <details id="guidance" class="panel guidance" open>
    <summary>练习与命令速查</summary>
    <div class="tabs" aria-label="学习工具"><button id="exercise-tab" aria-pressed="true" type="button">练习</button><button id="reference-tab" aria-pressed="false" type="button">命令速查</button></div>
    <section id="exercise-view" class="guide-body">
      <label class="muted" for="exercise">选择练习</label>
      <select id="exercise"></select>
      <h2 id="exercise-title"></h2>
      <p id="goal"></p>
      <ul id="steps"></ul>
      <button id="check" class="primary wide" type="button">查看检查结果</button>
      <p id="result" aria-live="polite"></p>
      <details id="hints"><summary>查看提示</summary><ol id="hint-list"></ol></details>
      <button id="scenario" class="secondary wide" type="button" hidden>进入独立练习环境</button>
      <button id="leave" class="secondary wide" type="button" hidden>返回主工作区</button>
    </section>
    <section id="reference-view" class="guide-body" hidden>
      <label class="muted" for="search">搜索命令</label>
      <input type="search" id="search" placeholder="例如 build、端口">
      <div id="reference-list"></div>
    </section>
  </details>
</main>
<dialog id="file-dialog">
  <form id="file-form">
    <h2 id="file-dialog-title"></h2>
    <label for="entry-path">路径</label><input id="entry-path" required>
    <label id="entry-type-label" for="entry-type">类型</label>
    <select id="entry-type"><option value="file">文件</option><option value="dir">目录</option></select>
    <p id="file-error" class="error" role="alert"></p>
    <div class="dialog-actions"><button id="cancel-file" class="secondary" type="button">取消</button><button class="primary" type="submit">确认</button></div>
  </form>
</dialog>
<dialog id="container-dialog">
  <h2 id="container-name"></h2>
  <p id="container-id" class="muted"></p><pre id="container-logs"></pre>
  <form method="dialog"><button class="secondary" type="submit">关闭</button></form>
</dialog>
<p id="notice" role="status"></p>
</body>
</html>
